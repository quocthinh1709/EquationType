<!doctype html>
<html lang="en" data-framework="typescript">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LSTS Equation Editor</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <script>
      window.MathJax = {
        loader: { load: ['output/svg'] },
        tex: { 
          // Bổ sung hàng loạt các gói mạnh mẽ nhất của TeX
          packages: {
            '[+]': [
              'mhchem',     // Hóa học (\ce)
              'ams',        // Ký hiệu Toán học chuẩn & môi trường cases
              'mathtools',  // Mở rộng của ams (\underbracket, mũi tên...)
              'extpfeil',   // Mũi tên dài
              'cancel',     // Gạch chéo rút gọn
              'physics',    // Vi tích phân, vector, ma trận
              'color',      // Tô màu chữ
              'enclose',    // Hỗ trợ các khung vẽ của MathLive
              'noerrors',   // Ẩn lỗi chữ đỏ khi gõ sai lệnh
              'noundefined' // Xử lý êm macro lạ
            ]
          } 
        },
        svg: { 
          fontCache: 'none' // Giữ nguyên, giúp tối ưu tái sử dụng font
        },
        startup: { 
          typeset: false // Giữ nguyên, rất quan trọng để tránh lỗi tự động render
        } 
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js"></script>
</head>

<body style="width: 100%; height: 100%; margin: 0; padding: 0;">
    <div id="container"></div>

    <!-- 
        Fluent UI React v. 9 uses modern JavaScript syntax that is not supported in
        Trident (Internet Explorer) or EdgeHTML (Edge Legacy), so this add-in won't
        work in Office versions that use these webviews. The script below makes the 
        following div display when an unsupported webview is in use, and hides the 
        React container div. 
    -->
    <div id="tridentmessage" style="display: none; padding: 10;">
        This add-in will not run in your version of Office. Please upgrade either to perpetual Office 2016 (or later) 
        or to a Microsoft 365 account.
    </div>
    <script>
        if ((navigator.userAgent.indexOf("Trident") !== -1) || (navigator.userAgent.indexOf("Edge") !== -1)) {
            var tridentMessage = document.getElementById("tridentmessage");
            var normalContainer = document.getElementById("container");
            tridentMessage.style.display = "block";
            normalContainer.style.display = "none";
        } 
    </script>
</body>

</html>
